name: "PR - Test Updated Features"

on:
  pull_request:

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      features: ${{ steps.detect.outputs.features }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed features
        id: detect
        run: |
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          FEATURES="[]"
          for dir in src/*/; do
            feature=$(basename "$dir")
            if git diff --name-only "$BASE_SHA"...HEAD | grep -qE "(src|test)/${feature}/"; then
              FEATURES=$(echo "$FEATURES" | jq -c ". + [\"$feature\"]")
            fi
          done
          echo "features=$FEATURES" >> "$GITHUB_OUTPUT"

  test:
    needs: detect-changes
    runs-on: ubuntu-latest
    if: ${{ needs.detect-changes.outputs.features != '[]' }}
    strategy:
      matrix:
        feature: ${{ fromJson(needs.detect-changes.outputs.features) }}
      fail-fast: false
    steps:
      - uses: actions/checkout@v4

      - name: "Test feature: ${{ matrix.feature }}"
        uses: devcontainers/action@v1
        with:
          base-path-to-features: "./src"
          features: ${{ matrix.feature }}
